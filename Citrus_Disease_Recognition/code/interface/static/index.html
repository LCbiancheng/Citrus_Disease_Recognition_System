<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>柑橘疾病识别系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #auth-container {
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: white;
            text-align: center;
        }

        h1 {
            color: #FF8C00;
            text-align: center; /* 确保h1居中 */
            margin-top: 20px; /* 顶部留点空隙 */
            margin-bottom: 30px; /* 给下方内容留空隙 */
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus, button:focus {
            outline: none;
            border-color: #FF8C00;
        }

        button {
            background-color: #FF8C00;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #FF7F00;
        }

        .toggle-link {
            color: #007BFF;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        #result {
            margin-top: 20px;
        }

        #recognition {
            display: none;
            text-align: center;
        }

        #result {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .image-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .image-container img {
            max-width: 300px;
        }

        .image-container h3 {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div id="auth-container">
    <h1>🍊 柑橘疾病识别系统</h1>

    <!-- 登录表单 -->
    <div id="login-form" class="form-container active">
        <h2>🔐 登录</h2>
        <input type="text" id="login-username" placeholder="用户名"/><br>
        <input type="password" id="login-password" placeholder="密码"/><br>
        <button onclick="login()">登录</button>
        <p>还没有账户？ <span class="toggle-link" onclick="toggleForm('register')">注册</span></p>
    </div>

    <!-- 注册表单 -->
    <div id="register-form" class="form-container">
        <h2>📝 注册</h2>
        <input type="text" id="register-username" placeholder="新用户名"/><br>
        <input type="password" id="register-password" placeholder="新密码"/><br>
        <button onclick="register()">注册</button>
        <p>已有账户？ <span class="toggle-link" onclick="toggleForm('login')">登录</span></p>
    </div>
</div>

<!-- 识别界面 -->

<div id="recognition">
<h1>🍊 柑橘疾病识别系统</h1>
    <h2>📸 上传图片进行识别</h2>
    <select id="recognition-type">
        <option value="fruit">柑橘果实疾病识别</option>
        <option value="leaf">柑橘叶疾病识别</option>
    </select><br>
    <input type="file" id="image-upload" multiple onchange="previewImages()"><br>
    <button onclick="recognize()">开始识别</button>

    <div id="result"></div>
</div>

<script>
    // 切换表单显示
    function toggleForm(formType) {
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        if (formType === 'login') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
        } else {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
        }
    }

    // 登录逻辑
    function login() {
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                if (data.status === 'success') {
                    // 登录成功，跳转到识别页面或隐藏登录表单
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('recognition').style.display = 'block';
                }
            });
    }

    // 注册逻辑
    function register() {
        const username = document.getElementById('register-username').value;
        const password = document.getElementById('register-password').value;

        fetch('/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        })
            .then(response => response.json())
            .then(data => alert(data.message));
    }

    let uploadedImages = []; // 用来存储上传的图片和顺序
    let imageContainers = []; // 用来存储每个图片的容器

    function previewImages() {
        const files = document.getElementById('image-upload').files;
        const resultContainer = document.getElementById('result');
        uploadedImages = [];  // 清空已上传的图片记录
        imageContainers = [];  // 清空之前的图片容器

        resultContainer.innerHTML = "";  // 清空之前的预览

        // 使用Promise来确保图片按顺序上传并预览
        let filePromises = [];

        // 显示所有上传的图片，并且按文件顺序展示
        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();

            let filePromise = new Promise((resolve, reject) => {
                reader.onload = function (event) {
                    const imgElement = document.createElement('img');
                    imgElement.src = event.target.result;
                    imgElement.alt = '上传的图片';
                    imgElement.style.maxWidth = '200px'; // 可根据需要调整大小

                    // 保存上传的图片文件和其顺序
                    uploadedImages.push({file: files[i], src: event.target.result, index: i});

                    const imageContainer = document.createElement('div');
                    imageContainer.classList.add('image-container');

                    // 添加图片和标题
                    imageContainer.innerHTML =
                        `<h3>图片 ${i + 1}</h3>`;
                    imageContainer.appendChild(imgElement);

                    // 将图片容器按顺序保存在数组中
                    imageContainers[i] = imageContainer;

                    resolve(); // 图片加载完成后执行
                };

                reader.onerror = function () {
                    reject('图片读取失败');
                };

                reader.readAsDataURL(files[i]);
            });

            filePromises.push(filePromise); // 将每个文件的Promise放入数组
        }

        // 等待所有文件都加载完成后按顺序插入图片
        Promise.all(filePromises).then(() => {
            // 所有图片都加载完成后，按顺序插入
            imageContainers.forEach(container => {
                resultContainer.appendChild(container);
            });
        }).catch((error) => {
            console.error(error);
        });
    }

    function recognize() {
    const formData = new FormData();
    const files = document.getElementById('image-upload').files;
    const type = document.getElementById('recognition-type').value;

    // 按上传顺序将所有文件添加到FormData中
    for (let i = 0; i < files.length; i++) {
        formData.append('image', files[i]);
    }
    formData.append('type', type);

    fetch('/recognize_multiple', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        const resultContainer = document.getElementById('result');
        resultContainer.innerHTML = ''; // 清空结果

        // 显示识别结果，并且保留之前上传的图片
        uploadedImages.forEach((image, index) => {
            const result = data.results[index];  // 获取对应图片的识别结果

            // 获取对应的图片容器
            const imageContainer = imageContainers[index];

            // 根据识别结果的标签生成跳转链接
            let diseaseLink = '';
            switch(result.label_en) {
                case 'blackspot':
                    diseaseLink = './static/blackspot.html';
                    break;
                case 'greening':
                    diseaseLink = './static/greening.html';
                    break;
                case 'scab':
                    diseaseLink = './static/scab.html';
                    break;
                case 'canker':
                    diseaseLink = './static/canker.html';
                    break;
                case 'melanose':
                    diseaseLink = './static/melanose.html';
                    break;
                case 'healthy':
                    diseaseLink = './static/healthy.html';
                    break;
                default:
                    diseaseLink = '#'; // 默认链接或可以处理的错误情况
                    break;
            }

            // 添加识别结果及跳转链接
            const resultText = `
                <h3>图片 ${index + 1} 识别结果</h3>
                <p>类别: ${result.label_cn} (${result.label_en})</p>
                <p>置信度: ${result.confidence}</p>
                <p>
                    <a href="${diseaseLink}" target="_blank">查看解决办法</a>
                </p>
            `;
            imageContainer.innerHTML += resultText; // 拼接识别结果到容器中

            resultContainer.appendChild(imageContainer); // 将图片容器添加到结果区
        });
    })
    .catch(err => console.error('请求失败:', err));
}


</script>
</body>
</html>
