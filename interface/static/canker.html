<h2>柑橘溃疡病</h2>
<p><b>病原：</b>柑橘溃疡病由 <span class="highlight">Xanthomonas citri</span> 细菌引起。</p>
<p><b>症状：</b>果实、叶片和枝条上出现黄色水渍状斑点，逐渐扩大形成溃疡，导致果实腐烂、枯萎及早期落果。</p>

<hr>

<h2 class="highlight">解决办法</h2>

<p><b>药物防治：</b></p>
<ul>
    <li>使用含铜成分的杀菌剂，如 <span class="highlight">氯氧铜</span>，进行定期喷洒。</li>
</ul>

<p><b>加强果园管理：</b></p>
<ul>
    <li>改善排水系统，保持果园通风干燥，避免过度湿润，减少细菌滋生。</li>
</ul>

<p><b>修剪和清除病果：</b></p>
<ul>
    <li>及时清除病果、病叶和病枝，减少病菌来源，防止扩散。</li>
</ul>

<p><b>抗病品种选择：</b></p>
<ul>
    <li>选用对溃疡病有抗性的柑橘品种。</li>
</ul>
